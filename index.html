<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Center Local</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app-layout">

    <!-- =========================
         COLUMNA IZQUIERDA
         VIDEO + CONTROLES
         ========================= -->

    <div class="left-column">

        <div class="player-box">

            <video
                id="videoPlayer"
                playsinline
                preload="metadata">
            </video>

            <div id="emptyMessage" class="empty-message">
                Selecciona un video para comenzar...
            </div>

            <div
                id="viewerVolumeControl"
                class="viewer-volume-control">

                <span>🔊</span>

                <input
                    type="range"
                    id="viewerVolume"
                    min="0"
                    max="1"
                    step="0.01"
                    value="1">

            </div>

        </div>


        <!-- CONTROLES DEL STREAMER -->

        <div
            id="streamerControls"
            class="streamer-controls-container">

            <div class="search-box">

                <input
                    type="text"
                    id="urlInput"
                    class="url-input"
                    placeholder="Pega un enlace directo (.mp4)">

                <button
                    id="loadBtn"
                    class="load-btn">
                    Cargar Video
                </button>

            </div>


            <div class="playlist-box">

                <select
                    id="chapterSelect"
                    class="playlist-select">

                    <option value="">
                        -- Selecciona un capítulo --
                    </option>

                    <option
                        value="https://github.com/AnimxCat/AnimxCat/releases/download/v1.0/evangelion1.mp4">
                        Evangelion 1
                    </option>

                    <option
                        value="https://github.com/AnimxCat/AnimxCat/releases/download/v1.0/anime.1.mp4">
                        Anime 1
                    </option>

                </select>

            </div>

        </div>

    </div>


    <!-- =========================
         COLUMNA DERECHA
         TWITCH + CHAT
         ========================= -->

    <div class="right-column">

        <div class="twitch-stream-box">

            <iframe
                id="twitchStreamFrame"
                class="iframe-fill"
                allowfullscreen>
            </iframe>

        </div>


        <div class="twitch-chat-box">

            <iframe
                id="twitchChatFrame"
                class="iframe-fill">
            </iframe>

        </div>

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
